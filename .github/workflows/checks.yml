name: Terraform checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Check formatting and saved-plan handoff
        run: |
          terraform fmt -check -recursive
          python -m unittest discover -s tests_ci -v
      - name: Validate and test the foundation without Azure access
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test
      - name: Validate bootstrap without Azure access
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=bootstrap validate
          terraform -chdir=bootstrap test
